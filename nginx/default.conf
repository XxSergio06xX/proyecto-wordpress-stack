server {
    # Escucha peticiones HTTP en el puerto 80 interno del contenedor
    listen 80;

    # Define el nombre de servidor
    server_name _;

    # Establece el directorio raíz donde residen los archivos web
    root /var/www/html;

    # Define el archivo por defecto que se buscará
    index index.php;

    # Ajusta el tamaño máximo permitido para la subida de archivos
    client_max_body_size 64M;

    # Redirige cualquier petición a archivos existentes o a index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Bloque de procesamiento para archivos .php
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
